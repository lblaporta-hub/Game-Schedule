name: Update GDESSA Calendars
on:
  schedule:
    - cron: "15 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-calendars:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/update_calendar.py
      - name: Commit calendar feeds if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calendars gdessa.ics
          if git diff --cached --quiet; then
            echo "No calendar changes."
          else
            git commit -m "Update GDESSA calendars from FPB"
            git push
          fi
