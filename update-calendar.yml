name: Update GDESSA Calendar

on:
  schedule:
    # Every day at 06:15 UTC (07:15 Portugal in summer / 06:15 in winter).
    - cron: "15 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-calendar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Update iCalendar feed
        run: python scripts/update_calendar.py

      - name: Commit calendar if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gdessa.ics
          if git diff --cached --quiet; then
            echo "No calendar changes."
          else
            git commit -m "Update GDESSA calendar from FPB"
            git push
          fi
